# Privacy-preserving static hosting for Lightning Lens.
# This file can replace /etc/nginx/conf.d/default.conf in the official nginx image.

# Log the path, never the query string or Referer.
log_format lightning_lens_no_query '$remote_addr - $remote_user [$time_local] '
                                    '"$request_method $uri $server_protocol" '
                                    '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript text/javascript text/plain image/svg+xml;

    access_log /var/log/nginx/access.log lightning_lens_no_query;
    error_log /var/log/nginx/error.log warn;

    # Analysis is local. Only an explicit node lookup may contact mempool.space.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://mempool.space; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Revalidate modules and workers after each deployment.
    expires -1;

    location ~ /\. {
        deny all;
    }

    # There are no backend routes or client-side deep links.
    location / {
        try_files $uri $uri/ =404;
    }
}
